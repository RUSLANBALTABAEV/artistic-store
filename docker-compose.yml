version: '3.8'

services:
  # ═════════════════════════════════════════════════════════════════════════
  # PostgreSQL Database
  # ═════════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:15-alpine
    container_name: artistic-store-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0001
      POSTGRES_DB: strapi_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d strapi_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - artistic-store-network
    restart: unless-stopped

  # ═════════════════════════════════════════════════════════════════════════
  # Redis Cache (Optional but recommended)
  # ═════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: artistic-store-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - artistic-store-network
    restart: unless-stopped

  # ═════════════════════════════════════════════════════════════════════════
  # 🚀 STRAPI CMS
  # ═════════════════════════════════════════════════════════════════════════
  strapi:
    build:
      context: ./apps/cms
      dockerfile: Dockerfile
    container_name: artistic-store-strapi
    environment:
      # Server Configuration
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_URL: http://localhost:1337
      
      # Admin & API Security
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change-me-in-production}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-change-me-in-production}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-change-me-in-production}
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key}
      
      # Database
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi_db
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      DATABASE_SCHEMA: public
      DATABASE_SSL: false
      DATABASE_POOL_MIN: 2
      DATABASE_POOL_MAX: 10
      
      # File Upload
      UPLOAD_PROVIDER: local
      UPLOAD_PATH: ./public/uploads
      
      # Email Configuration (Optional)
      EMAIL_PROVIDER: nodemailer
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@artisticstore.com}
      
      # External Services
      BACKEND_URL: http://backend:3001
      BACKEND_WEBHOOK_URL: http://backend:3001/webhooks/strapi
      FRONTEND_URL: http://frontend:3000
      
      # Internationalization
      I18N_LOCALES: en,ru,de,fr
      I18N_DEFAULT_LOCALE: en
      
      # Plugins
      GRAPHQL_ENABLED: true
      
      # Logging
      LOG_LEVEL: debug
      
      # Node Environment
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=2048
    
    ports:
      - "1337:1337"
    
    volumes:
      - ./apps/cms/src:/app/src
      - ./apps/cms/config:/app/config
      - ./apps/cms/public:/app/public
      - strapi_cache:/app/.cache
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:1337/admin"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - artistic-store-network
    
    restart: unless-stopped

  # ═════════════════════════════════════════════════════════════════════════
  # NestJS Backend API
  # ═════════════════════════════════════════════════════════════════════════
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: artistic-store-backend
    environment:
      # Server
      NODE_ENV: development
      PORT: 3001
      
      # Strapi Integration
      STRAPI_URL: http://strapi:1337
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:-}
      
      # Database
      DATABASE_URL: postgres://strapi:strapi@postgres:5432/api_db
      
      # Redis
      REDIS_URL: redis://redis:6379/0
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key}
      JWT_EXPIRATION: 24h
      
      # External Services
      FRONTEND_URL: http://frontend:3000
      
      # Logging
      LOG_LEVEL: debug
    
    ports:
      - "3001:3001"
    
    volumes:
      - ./apps/backend/src:/app/src
      - ./apps/backend/dist:/app/dist
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      strapi:
        condition: service_healthy
    
    networks:
      - artistic-store-network
    
    restart: unless-stopped

  # ═════════════════════════════════════════════════════════════════════════
  # Next.js Frontend
  # ═════════════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: artistic-store-frontend
    environment:
      # Next.js
      NODE_ENV: development
      
      # API URLs (public for browser)
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_STRAPI_URL: http://localhost:1337
      
      # Internal API URLs (server-side)
      API_URL: http://backend:3001
      STRAPI_URL: http://strapi:1337
    
    ports:
      - "3000:3000"
    
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    
    depends_on:
      - backend
      - strapi
    
    networks:
      - artistic-store-network
    
    restart: unless-stopped

# ═════════════════════════════════════════════════════════════════════════
# VOLUMES
# ═════════════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  strapi_cache:
    driver: local

# ═════════════════════════════════════════════════════════════════════════
# NETWORKS
# ═════════════════════════════════════════════════════════════════════════
networks:
  artistic-store-network:
    driver: bridge
